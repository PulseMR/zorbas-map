<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }

label { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; color: var(--muted); font-size: 14px; }
button { width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#msg { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
#msg.bad { color: var(--bad); }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

const KEY = "zormap-key-" + E.id, SESS = "zormap-sess-" + E.id;   // remembered key (device) / this tab only (survives reload after a save)
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = (t, bad) => { $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; };
const st = s => ({
  get() { try { return s.getItem(this.k); } catch (e) { return null; } },
  set(v) { try { s.setItem(this.k, v); } catch (e) {} },
  del() { try { s.removeItem(this.k); } catch (e) {} },
});
const local = Object.assign(st(window.localStorage), {k: KEY}), sess = Object.assign(st(window.sessionStorage), {k: SESS});
$("un").value = E.user || "Zorbas map";
if (E.user) $("who").textContent = E.user + ": πληκτρολογήστε τον κωδικό σας.";

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(E.salt), iterations: E.iter, hash: "SHA-256" }, base, 256));
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html) { document.open(); document.write(html); document.close(); }
async function offerSave(pw) {
  if (!$("save").checked || !window.PasswordCredential || !navigator.credentials) return;
  try {
    const cred = new PasswordCredential({ id: $("un").value, password: pw, name: "Ζορπάς · Χάρτης" });
    await Promise.race([navigator.credentials.store(cred), new Promise(r => setTimeout(r, 1500))]);
  } catch (e) {}
}
const saved = sess.get() || local.get();
if (saved) decrypt(b64(saved)).then(show, () => { sess.del(); local.del(); msg("Ο κωδικός άλλαξε. Πληκτρολογήστε τον νέο κωδικό.", true); });

$("f").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  msg("Άνοιγμα…");
  try {
    const pw = $("pw").value.trim();
    const raw = await derive(pw);
    const html = await decrypt(raw);
    const k = btoa(String.fromCharCode(...raw));
    sess.set(k);
    if ($("rem").checked) local.set(k);
    await offerSave(pw);
    show(html);
  } catch (x) {
    msg("Λάθος κωδικός.", true);
    $("go").disabled = false;
    $("pw").select();
  }
};
})();
